# Production compose for maxit (public URL: https://maxit.mini.pw.edu.pl).
# Usage: cp .env.example .env  (fill secrets), place TLS certs in ../nginx/ssl/
#        docker compose up -d
name: maxit
services:
  nginx:
    image: nginx:1.31.8-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/conf/nginx.mini-vm.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - file-storage
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:4.4.0-management
    environment:
      - RABBITMQ_DEFAULT_USER=${QUEUE_USER}
      - RABBITMQ_DEFAULT_PASS=${QUEUE_PASSWORD}
  file-storage:
    image: ghcr.io/mini-maxit/file-storage:latest
    # No host ports: nginx proxies /files/ -> :8888 and backend/worker reach
    # the internal API :8080 over the compose network. Nothing else may reach it.
    environment:
      - PUBLIC_SERVER_PORT=${PUBLIC_SERVER_PORT}
      - INTERNAL_SERVER_PORT=${INTERNAL_SERVER_PORT}
      - SIGNING_SECRET=${SIGNING_SECRET}
      - MAX_SIGN_TTL_SECONDS=${MAX_SIGN_TTL_SECONDS}
      - ROOT_DIRECTORY=${ROOT_DIRECTORY}
    volumes:
      - file-storage-media:/data
  backend:
    image: ghcr.io/mini-maxit/backend:latest
    depends_on:
      - rabbitmq
      - file-storage
      - db
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - COOKIE_SECURE=${COOKIE_SECURE}
      - QUEUE_HOST=${QUEUE_HOST}
      - QUEUE_PORT=${QUEUE_PORT}
      - QUEUE_USER=${QUEUE_USER}
      - QUEUE_PASSWORD=${QUEUE_PASSWORD}
      - APP_PORT=${APP_PORT}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - FILE_STORAGE_HOST=${FILE_STORAGE_HOST}
      - FILE_STORAGE_PORT=${FILE_STORAGE_PORT}
      - FILE_STORAGE_PUBLIC_URL=https://${DOMAIN}/files
      - CORS_ALLOWED_ORIGINS=https://${DOMAIN}
  db:
    image: postgres:17.11
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
  worker:
    image: ghcr.io/mini-maxit/worker:latest
    depends_on:
      - rabbitmq
      - db
      - backend
      - file-storage
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - jobs-data:/tmp
    environment:
      - RABBITMQ_HOST=${QUEUE_HOST}
      - RABBITMQ_PORT=${QUEUE_PORT}
      - RABBITMQ_USER=${QUEUE_USER}
      - RABBITMQ_PASSWORD=${QUEUE_PASSWORD}
      - DOCKER_HOST=${DOCKER_HOST}
      - JOBS_DATA_VOLUME=${JOBS_DATA_VOLUME} # must match compose project name prefix ("maxit_")
      - RESPONSE_QUEUE_NAME=${RESPONSE_QUEUE_NAME}
      - WORKER_QUEUE_NAME=${WORKER_QUEUE_NAME}
      - STORAGE_HOST=${FILE_STORAGE_HOST}
      - STORAGE_PORT=${FILE_STORAGE_PORT}
  frontend:
    image: ghcr.io/mini-maxit/frontend:latest
    depends_on:
      - backend
    environment:
      - PUBLIC_BACKEND_API_URL=https://${DOMAIN}/api/v1
      - ORIGIN=https://${DOMAIN}
      - BODY_SIZE_LIMIT=${BODY_SIZE_LIMIT}
    expose:
      - "3000"
volumes:
  file-storage-media:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ./volumes/file-storage-media
  jobs-data:
  pgdata:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ./volumes/pgdata
