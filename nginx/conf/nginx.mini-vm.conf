events {
    worker_connections 1024;
}

http {
    client_max_body_size 25m;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Rate limiting
    # Behind a front proxy all traffic shares one source IP, so key the limit
    # on the client IP the proxy reports (last X-Forwarded-For entry is the one
    # added by the trusted proxy). Falls back to remote addr when absent.
    map $http_x_forwarded_for $client_ip {
        "~(?P<last>[^, ]+)$" $last;
        default $binary_remote_addr;
    }
    limit_req_zone $client_ip zone=frontend:10m rate=30r/s;
    limit_req_zone $client_ip zone=api:10m rate=30r/s;

    proxy_buffer_size          32k;
    proxy_buffers              8 32k;
    proxy_busy_buffers_size    64k;
    large_client_header_buffers 4 64k;

    # Mini-VM: HTTP only, port 80, no TLS (front proxy or plain exposure).
    server {
        listen 80;
        server_name _;

        # Security headers (TLS-only HSTS intentionally omitted)
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Backend API
        location /api/ {
            limit_req zone=api burst=200 nodelay;

            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # File storage - signed URL downloads only, no write access from outside
        # Frontend URLs are like: /files/buckets/maxit/task/1/file.pdf?expires=...&signature=...
        # We strip the /files prefix so file-storage receives /buckets/... (matching the signed path)
        location /files/ {
            limit_except GET {
                deny all;
            }

            rewrite ^/files(/.*)$ $1 break;
            proxy_pass http://file-storage:8888;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Task-description PDFs render in a same-origin <iframe>, so framing
            # must be SAMEORIGIN here. add_header in a location replaces the
            # inherited server-level set — repeat all of them.
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;

            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Frontend serving
        location / {
            limit_req zone=frontend burst=200 nodelay;

            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # WebSocket support (if needed for frontend)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Nginx health check endpoint
        location /health {
            access_log off;
            return 200 "nginx healthy\n";
            add_header Content-Type text/plain;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
